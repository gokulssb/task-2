<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100">


     <nav class="bg-blue-700 text-white p-3 flex items-center justify-center ">

        <div class="flex items-center gap-3">
            <i class="fa-solid fa-hospital text-2xl"></i>
            <h1 class="text-2xl font-bold">ELITECARE Hospital</h1>
        </div>

     

    </nav>

<div class="max-w-lg mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">

<h1 class="text-3xl font-bold text-center text-blue-700 mb-6">
Book Appointment
</h1>

<input id="name" type="text" placeholder="Patient Name"
class="w-full border p-3 rounded mb-3">

<input id="age" type="number" placeholder="Age"
class="w-full border p-3 rounded mb-3">

<input id="phone" type="text" placeholder="Phone Number"
class="w-full border p-3 rounded mb-3">

<select id="department"
class="w-full border p-3 rounded mb-3">

<option>General</option>
<option>Cardiology</option>
<option>Orthopedic</option>
<option>Neurology</option>

</select>

<input id="date" type="date"
class="w-full border p-3 rounded mb-4">

<button onclick="bookAppointment()"
class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">

Book Appointment

</button>

<a href="demotwo.html"
class="block text-center mt-5 text-blue-600 font-semibold">
View Appointments →
</a>

</div>

<script>

function bookAppointment(){

let patient={
name:document.getElementById("name").value,
age:document.getElementById("age").value,
phone:document.getElementById("phone").value,
department:document.getElementById("department").value,
date:document.getElementById("date").value
};

let appointments=JSON.parse(localStorage.getItem("appointments")) || [];

appointments.push(patient);

localStorage.setItem("appointments",JSON.stringify(appointments));

alert("Appointment Booked Successfully");

document.getElementById("name").value="";
document.getElementById("age").value="";
document.getElementById("phone").value="";
document.getElementById("department").value="General";
document.getElementById("date").value="";

}

</script>

</body>
</html>
