<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointments</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">


     <nav class="bg-blue-700 text-white p-3 flex items-center justify-center ">

        <div class="flex items-center gap-3">
            <i class="fa-solid fa-hospital text-2xl"></i>
            <h1 class="text-2xl font-bold">ELITECARE Hospital</h1>
        </div>

     

    </nav>

<div class="max-w-6xl mx-auto mt-10">

<h1 class="text-4xl font-bold text-center text-blue-700 mb-8">
Appointment List
</h1>

<table class="w-full bg-white shadow rounded">

<thead class="bg-blue-600 text-white">

<tr>

<th class="p-3">Name</th>
<th class="p-3">Age</th>
<th class="p-3">Phone</th>
<th class="p-3">Department</th>
<th class="p-3">Date</th>
<th class="p-3">Action</th>

</tr>

</thead>

<tbody id="tableData"></tbody>

</table>

<div class="text-center mt-6">

<a href="demoAll.html"
class="bg-blue-600 text-white px-5 py-2 rounded">
Book New Appointment
</a>
<br><br><br>

<a href="../projectHospital/start.html" class="bg-blue-600 text-white px-5 py-2 rounded">➡️Move Back</a>

</div>



</div>

<script>

let appointments=JSON.parse(localStorage.getItem("appointments")) || [];

let table=document.getElementById("tableData");

appointments.forEach((item,index)=>{

table.innerHTML+=`

<tr class="border-b text-center">

<td class="p-3">${item.name}</td>

<td class="p-3">${item.age}</td>

<td class="p-3">${item.phone}</td>

<td class="p-3">${item.department}</td>

<td class="p-3">${item.date}</td>

<td class="p-3">

<button onclick="deleteAppointment(${index})"
class="bg-red-500 text-white px-3 py-1 rounded">

Delete

</button>

</td>

</tr>

`;

});

function deleteAppointment(index){

appointments.splice(index,1);

localStorage.setItem("appointments",JSON.stringify(appointments));

location.reload();

}

</script>

</body>

</html>
