<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms vancancy</title>

      <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="p-3 bg-blue-300 h-screen">

        <nav class="bg-gradient-to-r from-blue-500 to-cyan-500  text-white p-3 flex items-center justify-center ">

         <div class="flex items-center gap-3">
            <i class="fa-solid fa-hospital text-2xl"></i>
            <h1 class="text-3xl font-bold">ELITECARE Hospital</h1>
         </div>


         <div class="text-2xl font-bold flex justify-end gap-3 ">
             <a href="../projectHospital/project.html" >➡️Move to home</a>

           </div>

          </nav>


     <button
        id="openModal"
 class="sidebar-item w-full text-left px-5 py-4 rounded-xl">
            

        </button>


<div class="bg-white rounded-3xl shadow mx-8 mt-10 overflow-hidden h-500">

    <div class="flex justify-between items-center p-6">

        <h2 id="van" class="text-3xl font-bold">
            Room Vacancy
        </h2>

        <button
        id="addRoomBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl">

            Add Room

        </button>

    </div>

    <table class="w-full">

        <thead class="bg-gray-100">

            <tr class="text-left">

                <th class="p-4">Room No</th>
                <th>Type</th>
                <th>Floor</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="roomTable">

            <tr>

                <td class="p-4">101</td>

                <td>General</td>

                <td>1st</td>

                <td>

                    <span
                    class="bg-green-100 text-green-700 px-4 py-2 rounded-full">

                        Available

                    </span>

                </td>

                <td>

                    <button
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg">

                        Assign

                    </button>

                </td>

            </tr>

            <tr>

                <td class="p-4">202</td>

                <td>ICU</td>

                <td>2nd</td>

                <td>

                    <span
                    class="bg-red-100 text-red-600 px-4 py-2 rounded-full">

                        Occupied

                    </span>

                </td>

                <td>

                    <button
                    class="bg-gray-500 text-white px-4 py-2 rounded-lg">

                        View

                    </button>

                </td>

            </tr>

            <tr>

                <td class="p-4">305</td>

                <td>Deluxe</td>

                <td>3rd</td>

                <td>

                    <span
                    class="bg-green-100 text-green-700 px-4 py-2 rounded-full">

                        Available

                    </span>

                </td>

                <td>

                    <button
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg">

                        Assign

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>



    <div
id="modal"
class="fixed inset-0 bg-black/50 hidden justify-center items-center">

<div class="bg-white rounded-3xl w-96 p-8">

<h2 class="text-3xl font-bold mb-6">

Add Room

</h2>

<input
id="roomNo"
placeholder="Room Number"
class="border w-full p-3 rounded-xl mb-4">

<select
id="roomType"
class="border w-full p-3 rounded-xl mb-4">

<option>General</option>

<option>ICU</option>

<option>Deluxe</option>

<option>VIP</option>

</select>



<input
id="floor"
placeholder="Floor"
class="border w-full p-3 rounded-xl mb-6">

<div class="flex justify-end gap-4">

<button
id="closeModal"
class="bg-gray-500 text-white px-5 py-2 rounded-xl">

Cancel

</button>

<button
id="saveRoom"
class="bg-blue-600 text-white px-5 py-2 rounded-xl">

Save

</button>

</div>

</div>

</div>

<script>

const modal = document.getElementById("modal");
const openModal = document.getElementById("openModal");
const addRoomBtn = document.getElementById("addRoomBtn");
const closeModal = document.getElementById("closeModal");

openModal.onclick = () => modal.classList.remove("hidden");
addRoomBtn.onclick = () => modal.classList.remove("hidden");

closeModal.onclick = () => modal.classList.add("hidden");

modal.addEventListener("click", function(e) {
    if (e.target === modal) {
        modal.classList.add("hidden");
    }
});

// ===============================
// Add Room (DOM)
// ===============================
document.getElementById("saveRoom").addEventListener("click", () => {

    const room = document.getElementById("roomNo").value.trim();
   
    const type = document.getElementById("roomType").value;
    const floor = document.getElementById("floor").value.trim();

    if(room==="" || floor===""){
        alert("Please fill all fields");
        return;
    }

    const row = document.createElement("tr");

    row.innerHTML = `
        <td class="p-4">${room}</td>
        <td>${type}</td>
        <td>${floor}</td>

        <td>
            <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full">
                Available
            </span>
        </td>

        <td>
            <button class="deleteBtn bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                Delete
            </button>
        </td>
    `;

    document.getElementById("roomTable").appendChild(row);

    document.getElementById("roomNo").value = "";
    document.getElementById("floor").value = "";

    modal.classList.add("hidden");

});

// ===============================
// Delete Room
// ===============================
document.addEventListener("click", function(e){

    if(e.target.classList.contains("deleteBtn")){

        if(confirm("Delete this room?")){

            e.target.closest("tr").remove();

        }

    }

});

</script>



<div class="grid grid-cols-1 md:grid-cols-4 gap-6 p-8">

<div class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-2xl p-6 shadow-xl">
<p>Total Rooms</p>
<h2 class="text-4xl font-bold mt-2">20</h2>
</div>

<div class="bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-2xl p-6 shadow-xl">
<p>Available</p>
<h2 class="text-4xl font-bold mt-2">11</h2>
</div>

<div class="bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-2xl p-6 shadow-xl">
<p>Occupied</p>
<h2 class="text-4xl font-bold mt-2">9</h2>
</div>

<div class="bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-2xl p-6 shadow-xl">
<p>ICU Rooms</p>
<h2 class="text-4xl font-bold mt-2">8</h2>
</div>

</div>


</div>  

</body>
</html>
