}

transition:.4s;
}

.card:hover{
transform:translateY(-8px) scale(1.03);
}

</style>

</head>

<body>

<nav class="bg-white shadow-lg px-10 py-5 flex justify-between items-center">

<h1 class="text-3xl font-bold text-cyan-700">

<div class="flex items-center gap-6">


    <a href="../projectHospital/project.html" class="text-2xl font-bold ">➡️Move to home</a>

class="absolute -top-2 -right-2 bg-red-500 text-xs w-6 h-6 rounded-full flex items-center justify-center">
0
</span>

</button> -->

</div>

</nav>


<!-- Hero -->

<section class="max-w-7xl mx-auto mt-10">

<div class="bg-gradient-to-r from-cyan-600 to-blue-700 rounded-3xl p-12 text-white shadow-2xl">

<h2 class="text-5xl font-bold">
Healthy Life Starts Here
</h2>

<p class="mt-4 text-lg">
Find genuine medicines with fast delivery and trusted pharmacy service.
</p>

<div class="mt-8">

type="text"
placeholder="Search Medicine..."

</div>

</div>

<!-- Medicine Section -->

<section class="max-w-7xl mx-auto mt-14">

<h2 class="text-4xl font-bold text-center text-cyan-700 mb-10">
Available Medicines
</h2>

<div
id="medicineContainer"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">

</div>

</section>



<script>

let cart=0;

const medicines=[

{
name:"Paracetamol",
price:50,
stock:"Available",
image:"💊"
},

{
name:"Vitamin C",
price:120,
stock:"Available",
image:"🍊"
},

{
name:"Insulin",
price:450,
stock:"Limited",
image:"💉"
},

{
name:"Cough Syrup",
price:180,
stock:"Available",
image:"🧴"
},

{
name:"Pain Relief Gel",
price:160,
stock:"Available",
image:"🩹"
},

{
name:"Antibiotic",
price:300,
stock:"Limited",
image:"💊"
},

{
name:"Face Mask",
price:40,
stock:"Available",
image:"😷"
},

{
name:"Hand Sanitizer",
price:80,
stock:"Available",
image:"🧼"
}

];

const container=document.getElementById("medicineContainer");

function displayMedicine(list){

container.innerHTML="";

list.forEach(item=>{

container.innerHTML+=`

<div class="card bg-white rounded-3xl shadow-xl p-6">

<div class="text-7xl text-center">
${item.image}
</div>

<h3 class="text-2xl font-bold mt-5">
${item.name}
</h3>

<p class="mt-3 text-gray-600">
Price :
<span class="font-bold text-green-600">
₹${item.price}
</span>
</p>

<p class="mt-2">

Stock :

<span class="${
item.stock=="Available"
?"text-green-600"
:"text-orange-500"
} font-bold">

${item.stock}

</span>

</p>

<button
onclick="addCart()"
class="mt-6 w-full bg-cyan-600 hover:bg-cyan-700 text-white py-3 rounded-xl">

Add To Cart

</button>

</div>

`;

});

}

displayMedicine(medicines);

function addCart(){

cart++;

document.getElementById("count").innerText=cart;

}

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let filter=medicines.filter(item=>item.name.toLowerCase().includes(value));

displayMedicine(filter);

});

</script>



</body>
</html>
