<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteCare Laboratory Monitoring</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#dbeafe,#f0f9ff,#ffffff);
}
</style>

</head>

<body>


    

<div class="max-w-7xl mx-auto p-8">

<div class="bg-gradient-to-r from-cyan-600 to-blue-700 rounded-3xl p-8 text-white shadow-xl">

<h1 class="text-4xl font-bold">
🧪 EliteCare Laboratory Monitoring
</h1>

<p class="opacity-80 mt-2">
Manage Laboratory Tests Efficiently
</p>

</div>

 Cards

<div class="grid md:grid-cols-4 gap-6 mt-8">

<div class="bg-white rounded-3xl shadow-lg p-6">

<h2>Total Tests</h2>

<p id="total" class="text-4xl font-bold text-blue-600 mt-3">
0
</p>

</div>

<div class="bg-white rounded-3xl shadow-lg p-6">

<h2>Pending</h2>

<p id="pending" class="text-4xl font-bold text-red-500 mt-3">
0
</p>

</div>

<div class="bg-white rounded-3xl shadow-lg p-6">

<h2>Completed</h2>

<p id="completed" class="text-4xl font-bold text-green-600 mt-3">
0
</p>

</div>

<div class="bg-white rounded-3xl shadow-lg p-6">

<h2>Urgent</h2>

<p id="urgent" class="text-4xl font-bold text-orange-500 mt-3">
0
</p>

</div> 

 Form 

 </div> 



<div class="p-5">

<div class="bg-white rounded-3xl shadow-lg mt-10 p-8">

<h2 class="text-2xl font-bold mb-6">
Add Laboratory Test
</h2>

<div class="grid md:grid-cols-5 gap-4">

<input
id="patient"
placeholder="Patient Name"
class="border rounded-xl p-3">

<input
id="test"
placeholder="Test Name"
class="border rounded-xl p-3">

<select id="priority" class="border rounded-xl p-3">

<option>Normal</option>
<option>Urgent</option>

</select>

<select id="status" class="border rounded-xl p-3">

<option>Pending</option>
<option>Completed</option>

</select>

<button
onclick="saveTest()"
class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl">
Add Test
</button>

</div>

</div>

<!-- Table -->

<div class="bg-white rounded-3xl shadow-lg mt-10 overflow-hidden">

<table class="w-full">

<thead class="bg-blue-600 text-white">

<tr>

<th class="p-4">Patient</th>

<th>Test</th>

<th>Priority</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="table">

</tbody>

</table>

</div>

</div>

</div>

<script>

let tests=JSON.parse(localStorage.getItem("labTests"))||[];

function saveStorage(){

localStorage.setItem("labTests",JSON.stringify(tests));

}

function saveTest(){

let patient=document.getElementById("patient").value;

let test=document.getElementById("test").value;

let priority=document.getElementById("priority").value;

let status=document.getElementById("status").value;

if(patient==""||test==""){

alert("Fill all fields");

return;

}

tests.push({

patient,

test,

priority,

status

});

saveStorage();

showTests();

document.getElementById("patient").value="";
document.getElementById("test").value="";

}

function showTests(){

let table=document.getElementById("table");

table.innerHTML="";

let pending=0;
let completed=0;
let urgent=0;

tests.forEach((item,index)=>{

if(item.status=="Pending") pending++;

if(item.status=="Completed") completed++;

if(item.priority=="Urgent") urgent++;

table.innerHTML+=`

<tr class="border-b hover:bg-blue-50">

<td class="p-4">${item.patient}</td>

<td>${item.test}</td>

<td>

<span class="px-3 py-1 rounded-full
${item.priority=="Urgent"?"bg-red-100 text-red-600":"bg-green-100 text-green-600"}">

${item.priority}

</span>

</td>

<td>

<select
class="border rounded-lg p-1"
onchange="changeStatus(${index},this.value)">

<option ${item.status=="Pending"?"selected":""}>Pending</option>

<option ${item.status=="Completed"?"selected":""}>Completed</option>

</select>

</td>

<td>

<button
onclick="deleteTest(${index})"
class="bg-red-500 text-white px-4 py-2 rounded-lg">

Delete

</button>

</td>

</tr>

`;

});

document.getElementById("total").innerHTML=tests.length;
document.getElementById("pending").innerHTML=pending;
document.getElementById("completed").innerHTML=completed;
document.getElementById("urgent").innerHTML=urgent;

}

function changeStatus(index,value){

tests[index].status=value;

saveStorage();

showTests();

}

function deleteTest(index){

tests.splice(index,1);

saveStorage();

showTests();

}

showTests();

</script>

</body>
</html>
