<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Simple Interest Calculator</h2>

    <label>Principal Amount</label>
    <input type="number" id="principal" placeholder="Enter Principal">

    <label>Rate (%)</label>
    <input type="number" id="rate" placeholder="Enter Rate">

    <label>Time (Years)</label>
    <input type="number" id="time" placeholder="Enter Time">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

</div>

<script>
function calculate() {

    let principal = Number(document.getElementById("principal").value);
    let rate = Number(document.getElementById("rate").value);
    let time = Number(document.getElementById("time").value);

    let simpleInterest = (principal * rate * time) / 100;
    let totalAmount = principal + simpleInterest;

    document.getElementById("result").innerHTML =
        "Simple Interest: ₹" + simpleInterest.toFixed(2) +
        "<br>Total Amount: ₹" + totalAmount.toFixed(2);
}
</script>

</body>
</html>
